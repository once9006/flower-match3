isplay:flex;flex-direction:column;gap:9px}.btn{background:#267ab3;color:white;border:0;border-radius:13px;padding:13px 9px;font-weight:800;min-height:49px}.btn.alt{background:white;color:#245a7a;border:2px solid #a8ccdf}.btn.danger{background:#a63d43}.status{background:#fff;border-radius:14px;padding:12px;text-align:center;min-height:50px;font-size:18px;font-weight:800;margin:10px 0}.toast{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);background:#fffce5;color:#135f3c;border:3px solid #ffc84b;padding:10px 17px;border-radius:18px;font-size:clamp(19px,4vw,29px);font-weight:900;z-index:12;white-space:nowrap;pointer-events:none;animation:toast .9s forwards}.toast.bad{color:#a34141;border-color:#e9a0a0}.particle{position:absolute;width:12px;height:9px;background:var(--color);border:1px solid #8b432b;z-index:10;pointer-events:none;animation:particle .72s ease-out forwards}.overlay{position:fixed;inset:0;background:#183a50aa;z-index:30;display:grid;place-items:center;padding:14px}.overlay.hidden{display:none}.modal{background:#fff;border-radius:22px;padding:22px;width:min(420px,100%);max-height:90vh;overflow:auto;text-align:center;box-shadow:0 10px 40px #1b3b5266}.modal h2{margin:4px 0 15px}.modal .btn{display:block;width:100%;margin:8px 0}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.levels button{padding:10px 0;border:0;border-radius:10px;background:#d8effb;font-weight:800}.levels button:disabled{opacity:.35}.levels .done{background:#c8efc8}.note{font-size:13px;color:#617786}.tog{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #ddd;font-size:18px}.tog input{width:23px;height:23px}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-5px)}}@keyframes hint{50%{box-shadow:inset 0 0 0 5px #f9c243}}@keyframes shatter{40%{transform:scale(1.2);filter:brightness(1.6)}100%{transform:scale(.1) rotate(20deg);opacity:0}}@keyframes fall{from{transform:translateY(-6 </style></head><body><div id="domainGate" style="max-width:520px;margin:12vh auto;padding:24px;text-align:center;font:16px system-ui;color:#333"><h2>이용할 수 없는 사이트입니다.</h2><p>이 게임은 wonsdiary.com에서만 실행할 수 있습니다.</p><a href="https://www.wonsdiary.com/" target="_top" rel="noopener">공식 사이트 방문</a></div><div id="gameContent" hidden><div class="wrap"><div class="head"><h1>🧩 꽃과 과일 퍼즐</h1><div>같은 그림 3개를 맞춰 벽돌을 깨뜨리세요!</div></div><div class="info"><div class="stat">레벨<strong id="level">1</strong></div><div class="stat">남은 이동<strong id="moves">25</strong></div><div class="stat">남은 벽돌<strong id="bricks">0</strong></div></div><div class="game"><div><div id="board" class="board" aria-label="퍼즐판"></div><div id="status" class="status" aria-live="polite">그림을 밀어 맞춰보세요.</div></div><div class="side"><button class="btn" id="hint">💡 힌트</button><button class="btn alt" id="retry">↻ 다시 하기</button><button class="btn alt" id="levels">▦ 레벨 선택</button><button class="btn alt" id="home">☰ 시작 메뉴</button><button class="btn alt" id="settings">⚙ 소리·설정</button></div></div><p class="note">광고 없음 · 시간제한 없음 · 진행 자동 저장 · 음악은 시작 버튼을 누른 뒤 재생됩니다.</p></div><div id="overlay" class="overlay"><div id="modal" class="modal"></div></div></div>
<script>
(()=>{'use strict';
const ALLOWED_HOSTS=new Set(['www.wonsdiary.com','wonsdiary.com']);
function allowedOrigin(origin){
 try{const u=new URL(origin);return u.protocol==='https:' && ALLOWED_HOSTS.has(u.hostname.toLowerCase());}
 catch(e){return false;}
}
const ownHost=ALLOWED_HOSTS.has(location.hostname.toLowerCase());
const referrerAllowed=window.self!==window.top && allowedOrigin(document.referrer);
let initialized=false;
function launch(){
 if(initialized)return;
 initialized=true;
 document.getElementById('domainGate').remove();
 document.getElementById('gameContent').hidden=false;
 initGame();
}
function initGame(){
const KEY='wons_match3_v3',N=6,FRUITS=['🍎','🍋','🍇','🍓','🍊','🌼'],B='🪨',$=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{}
let level=1,board=[],brick=[],moves=0,sel=-1,busy=false,settings={sound:true,music:true,hint:true,...saved.settings},timer=null,ctx=null,musicTimer=null,musicStep=0;
const rand=n=>Math.floor(Math.random()*n),idx=(r,c)=>r*N+c;
function persist(){saved.settings=settings;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}}
function spec(l){return {k:Math.min(6,3+Math.floor((l-1)/9)),moves:Math.max(18,30-Math.floor((l-1)/14)),bricks:Math.min(29,5+Math.floor((l-1)/2)),rocks:l<25?0:Math.min(4,1+Math.floor((l-25)/30))}}
function adj(a,b){return a>=0&&b>=0&&a<36&&b<36&&(Math.abs(a-b)===6||(Math.floor(a/6)===Math.floor(b/6)&&Math.abs(a-b)===1))}
function matches(b){let out=new Set();for(let r=0;r<6;r++)for(let c=0;c<6;c++){let i=idx(r,c),v=b[i];if(!v||v===B)continue;let h=c;while(h<6&&b[idx(r,h)]===v)h++;if(h-c>=3)for(let x=c;x<h;x++)out.add(idx(r,x));let z=r;while(z<6&&b[idx(z,c)]===v)z++;if(z-r>=3)for(let x=r;x<z;x++)out.add(idx(x,c))}return [...out]}
function swap(a,b){[board[a],board[b]]=[board[b],board[a]]}
function hintPair(){for(let a=0;a<36;a++)for(let b of [a+1,a+6]){if(!adj(a,b)||board[a]===B||board[b]===B)continue;swap(a,b);let yes=matches(board).length>0;swap(a,b);if(yes)return[a,b]}return null}
function make(l){let s=spec(l),b;for(let attempt=0;attempt<500;attempt++){b=Array(36).fill(null);for(let i=0;i<s.rocks;i++){let p=rand(36);if(b[p]){i--;continue}b[p]=B}for(let i=0;i<36;i++){if(b[i]===B)continue;let opts=FRUITS.slice(0,s.k).filter(v=>!(i%6>1&&b[i-1]===v&&b[i-2]===v)&&!(i>11&&b[i-6]===v&&b[i-12]===v));b[i]=opts[rand(opts.length)]||FRUITS[rand(s.k)]}board=b;if(hintPair())break}board=b;brick=Array(36).fill(0);let places=Array.from({length:36},(_,i)=>i).filter(i=>b[i]!==B);for(let i=places.length-1;i>0;i--){let j=rand(i+1);[places[i],places[j]]=[places[j],places[i]]}places.slice(0,s.bricks).forEach(i=>brick[i]=l>20&&i%5===0?2:1);moves=s.moves}
function remaining(){return brick.reduce((a,b)=>a+(b>0?1:0),0)}
function save(){saved.level=level;saved.board=[...board];saved.brick=[...brick];saved.moves=moves;saved.max=Math.max(saved.max||1,level);persist()}
function draw(){let el=$('board');el.innerHTML='';board.forEach((v,i)=>{let c=document.createElement('button');c.className='cell'+(sel===i?' sel':'');c.dataset.i=i;c.disabled=busy||v===B;c.setAttribute('aria-label',`${Math.floor(i/6)+1}행 ${i%6+1}열 ${v}`);if(brick[i]){let bg=document.createElement('span');bg.className='brick'+(brick[i]>1?' crack':'');c.append(bg)}let t=document.createElement('span');t.className='fruit';t.textContent=v||'';c.append(t);el.append(c)});$('level').textContent=level;$('moves').textContent=moves;$('bricks').textContent=remaining()}
function message(s,type=''){let e=$('status');e.textContent=s;e.style.color=type==='bad'?'#b44845':type==='good'?'#15834d':'#274056'}
function pop(s,bad=false){let el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=s;$('board').append(el);setTimeout(()=>el.remove(),920)}
function shards(indices){let el=$('board'),cells=el.querySelectorAll('.cell'),outer=el.getBoundingClientRect();for(let i of indices){let r=cells[i]?.getBoundingClientRect();if(!r)continue;for(let j=0;j<9;j++){let p=document.createElement('i');p.className='particle';p.style.left=(r.left-outer.left+r.width/2)+'px';p.style.top=(r.top-outer.top+r.height/2)+'px';p.style.setProperty('--color',['#b65a3c','#e9a16c','#87432f','#f1c48a'][j%4]);p.style.setProperty('--x',(Math.cos(j*2.4)*(15+rand(55)))+'px');p.style.setProperty('--y',(Math.sin(j*2.4)*(15+rand(55)))+'px');p.style.setProperty('--rot',(rand(500)-250)+'deg');el.append(p);setTimeout(()=>p.remove(),730)}}}
function initAudio(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch{}}
function note(f,d=.12,vol=.04,type='sine',offset=0){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+offset;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.03)}
function sfx(type){if(!settings.sound)return;initAudio();if(type==='move')note(420,.08,.035);if(type==='bad'){note(230,.16,.05,'triangle');note(175,.19,.04,'triangle',.1)}if(type==='hit'){note(170,.11,.08,'sawtooth');note(95,.16,.06,'triangle',.06);note(640,.12,.025,'sine',.12)}if(type==='drop')note(320,.08,.018);if(type==='win')[523,659,784,1046,1318].forEach((f,i)=>note(f,.25,.055,'sine',i*.12))}
const MELODY=[659,784,880,784,659,587,523,587,659,784,988,880,784,659,587,523,587,659,784,659,587,523,494,523,587,659,784,880,784,659,587,523],BASS=[261.63,220,174.61,196];
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){stopMusic();if(!settings.music)return;initAudio();if(!ctx)return;musicTimer=setInterval(()=>{if(document.hidden)return;let n=musicStep++,k=n%32;if(k%2===0)note(MELODY[k],.19,.014,'sine');if(k%4===0)note(BASS[Math.floor(k/8)],.32,.011,'triangle');if(k%8===4)note(MELODY[k]/2,.25,.009,'sine')},235)}
function show(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden');stopMusic()}
function hide(){$('overlay').classList.add('hidden');startMusic()}
function schedule(){clearTimeout(timer);if(settings.hint)timer=setTimeout(()=>{if(!busy&&$('overlay').classList.contains('hidden'))hint()},18000)}
function start(l,restore=true){clearTimeout(timer);level=l;let s=spec(l);if(restore&&saved.level===l&&Array.isArray(saved.board)&&saved.board.length===36&&Array.isArray(saved.brick)&&saved.brick.length===36&&saved.moves>0){board=[...saved.board];brick=[...saved.brick];moves=saved.moves}else make(l);sel=-1;busy=false;save();draw();message('같은 그림 3개를 맞춰 벽돌을 깨세요!');hide();schedule()}
function collapse(){for(let c=0;c<6;c++){let r=5;while(r>=0){if(board[idx(r,c)]===B){r--;continue}let bottom=r;while(r>=0&&board[idx(r,c)]!==B)r--;let top=r+1,vals=[];for(let x=bottom;x>=top;x--)if(board[idx(x,c)]!==null)vals.push(board[idx(x,c)]);for(let x=bottom;x>=top;x--)board[idx(x,c)]=vals[bottom-x]??FRUITS[rand(spec(level).k)]}}}
function finish(win){busy=true;clearTimeout(timer);if(win){saved.max=Math.max(saved.max||1,level+1);saved.level=level+1;delete saved.board;delete saved.brick;persist();sfx('win');show(`<h2>🎉 ${level}레벨 성공!</h2><p>벽돌을 모두 깨뜨렸어요! 정말 잘하셨어요.</p><button class="btn" id="next">다음 레벨 ▶</button><button class="btn alt" id="main">시작 메뉴</button>`);$('next').onclick=()=>start(level+1,false)}else{save();show(`<h2>조금만 더 도전해보세요!</h2><p>벽돌 ${remaining()}개가 남았어요.</p><button class="btn" id="again">다시 도전하기</button><button class="btn alt" id="main">시작 메뉴</button>`);$('again').onclick=()=>start(level,false)}$('main').onclick=home}
async function attempt(a,b){if(busy||!adj(a,b)||board[a]===B||board[b]===B)return;busy=true;clearTimeout(timer);sel=-1;draw();let cells=$('board').querySelectorAll('.cell'),ra=cells[a].getBoundingClientRect(),rb=cells[b].getBoundingClientRect(),dx=rb.left-ra.left,dy=rb.top-ra.top;cells[a].style.transform=`translate(${dx}px,${dy}px)`;cells[b].style.transform=`translate(${-dx}px,${-dy}px)`;sfx('move');await wait(230);swap(a,b);draw();if(!matches(board).length){pop('맞지 않아요. 다시 해보세요',true);message('맞지 않는 그림이에요. 다시 해보세요.','bad');sfx('bad');let c=$('board').querySelectorAll('.cell');c[a].classList.add('invalid');c[b].classList.add('invalid');await wait(370);swap(a,b);busy=false;draw();schedule();return}
moves--;let chain=0,broken=0;while(chain<30){let m=matches(board);if(!m.length)break;chain++;let hits=m.filter(i=>brick[i]>0);hits.forEach(i=>{brick[i]--;if(brick[i]===0)broken++});pop(hits.length?`🧱 벽돌 ${hits.length}번 타격!`:`✨ 그림 ${m.length}개 성공!`);message(`잘했어요! ${m.length}개 제거 · 벽돌 ${broken}개 파괴`,'good');sfx('hit');shards(hits);let cc=$('board').querySelectorAll('.cell');m.forEach(i=>cc[i]?.classList.add('break'));await wait(440);m.forEach(i=>board[i]=null);collapse();draw();$('board').querySelectorAll('.cell').forEach(c=>c.classList.add('fall'));sfx('drop');await wait(350);draw()}
if(remaining()===0){save();finish(true);return}if(moves<=0){save();finish(false);return}if(!hintPair()){let oldBrick=[...brick],oldMoves=moves;make(level);brick=oldBrick;moves=oldMoves;message('맞출 수 있는 그림이 없어 그림만 새로 배치했어요.','good')}save();busy=false;draw();schedule()}
function choose(i){if(busy||board[i]===B)return;if(sel===-1){sel=i;draw();return}if(sel===i){sel=-1;draw();return}if(adj(sel,i))attempt(sel,i);else{sel=i;draw()}}
let down=null;let grid=$('board');grid.addEventListener('pointerdown',e=>{let c=e.target.closest('.cell');if(c)down={i:+c.dataset.i,x:e.clientX,y:e.clientY}});grid.addEventListener('pointerup',e=>{if(!down)return;let d=down;down=null;let dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18){let b=d.i+(Math.abs(dx)>Math.abs(dy)?(dx>0?1:-1):(dy>0?6:-6));if(adj(d.i,b))attempt(d.i,b)}else choose(d.i)});grid.addEventListener('pointercancel',()=>down=null);
function hint(){if(busy)return;let p=hintPair();if(!p){message('맞출 수 있는 그림이 없어 퍼즐을 바꿉니다.');{let oldBrick=[...brick],oldMoves=moves;make(level);brick=oldBrick;moves=oldMoves}save();draw();return}let cells=grid.querySelectorAll('.cell');p.forEach(i=>cells[i]?.classList.add('hint'));message('반짝이는 두 그림을 바꿔보세요.');setTimeout(()=>p.forEach(i=>cells[i]?.classList.remove('hint')),1900)}
function home(){show(`<h2>🌼 꽃과 과일 퍼즐</h2><p>현재 레벨 ${saved.level||1} · 최고 레벨 ${saved.max||1}</p><button class="btn" id="resume">▶ 이어서 하기</button><button class="btn alt" id="pick">▦ 레벨 선택</button><button class="btn alt" id="opts">⚙ 소리·설정</button><p class="note">벽돌을 모두 깨뜨리면 성공! 진행 상황은 자동 저장됩니다.</p>`);$('resume').onclick=()=>start(saved.level||1,true);$('pick').onclick=levels;$('opts').onclick=options}
function levels(){let max=saved.max||1,total=Math.max(30,Math.ceil(max/30)*30),html='<h2>레벨 선택</h2><div class="levels">';for(let i=1;i<=total;i++)html+=`<button class="${i<max?'done':''}" data-l="${i}" ${i>max?'disabled':''}>${i}</button>`;html+='</div><button class="btn alt" id="back">돌아가기</button>';show(html);$('modal').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(+b.dataset.l,+b.dataset.l===(saved.level||1)));$('back').onclick=home}
function options(){show(`<h2>⚙ 게임 설정</h2><label class="tog">효과음 <input id="sound" type="checkbox" ${settings.sound?'checked':''}></label><label class="tog">배경음악 <input id="music" type="checkbox" ${settings.music?'checked':''}></label><label class="tog">자동 힌트 <input id="autohint" type="checkbox" ${settings.hint?'checked':''}></label><button class="btn alt" id="first">1레벨부터 다시 플레이</button><button class="btn danger" id="reset">모든 기록 삭제</button><button class="btn alt" id="back">돌아가기</button>`);$('sound').onchange=e=>{settings.sound=e.target.checked;persist()};$('music').onchange=e=>{settings.music=e.target.checked;persist()};$('autohint').onchange=e=>{settings.hint=e.target.checked;persist()};$('first').onclick=()=>confirmAction('최고 레벨 기록을 유지하고 1레벨부터 시작할까요?',()=>start(1,false));$('reset').onclick=()=>confirmAction('모든 레벨 기록을 삭제할까요?',()=>{saved={settings};persist();start(1,false)});$('back').onclick=home}
function confirmAction(title,yes){show(`<h2>${title}</h2><button class="btn danger" id="yes">확인</button><button class="btn alt" id="no">취소</button>`);$('yes').onclick=yes;$('no').onclick=options}
